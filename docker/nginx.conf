server {
    listen 80;

    # Proxy all backend API endpoints
    location ~ ^/(upload|list_files|delete_file|run_cfc_wavelet_analysis|run_hub_detection|get_growth_curve|run_normative_analysis|run_bids_conversion|bids_report|run_bids_conversion_stream|run_command_stream|parse_csv|roi_figs|visualize_bold_adj|get_phenotypes|apply_fdr_correction|detect_outliers|run_correlation|run_group_comparison|health|sse|messages) {
        proxy_pass http://backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA fallback: serve index.html for all other paths
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
